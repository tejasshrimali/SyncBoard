<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52796F" />
      <stop offset="100%" stop-color="#354F52" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2F3E46" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Base board -->
  <rect x="76" y="96" width="360" height="360" rx="44" fill="#FFFFFF" stroke="#CAD2C5" stroke-width="8" filter="url(#softShadow)"/>
  
  <!-- Clip top -->
  <rect x="186" y="56" width="140" height="72" rx="20" fill="url(#bgGrad)" stroke="#2F3E46" stroke-width="6"/>
  <circle cx="256" cy="86" r="14" fill="#FFFFFF"/>

  <!-- Board lines / paper sheets -->
  <rect x="126" y="180" width="260" height="20" rx="10" fill="#E8F0EB"/>
  <rect x="126" y="224" width="190" height="20" rx="10" fill="#E8F0EB"/>
  <rect x="126" y="268" width="220" height="20" rx="10" fill="#E8F0EB"/>

  <!-- Sync badge circle with cute arrows -->
  <circle cx="340" cy="340" r="64" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="8" filter="url(#softShadow)"/>
  <!-- Sync Arrows -->
  <path d="M340 304 C360 304 376 320 376 340 C376 348 373 355 368 361 L376 369 M376 369 L356 369 M376 369 L376 349" 
        stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M340 376 C320 376 304 360 304 340 C304 332 307 325 312 319 L304 311 M304 311 L324 311 M304 311 L304 331" 
        stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>